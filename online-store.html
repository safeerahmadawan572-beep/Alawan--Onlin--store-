<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d461e"><title>Online Store</title>
<style>
:root{--g:#146c2e;--d:#0d461e;--g2:#488c5c;--t:#ecf3ee;--l:#dce9e0;--bg:#f3f8f5;--ink:#1c2420;--mut:#66726b;--wa:#1faa59}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:100px}
button,input,select{font:inherit}button{cursor:pointer}
.hero{background:linear-gradient(135deg,var(--d),var(--g) 62%,var(--g2));color:#fff;padding:22px 16px 52px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:220px;height:220px;right:-70px;top:-80px}.hero:after{width:140px;height:140px;left:-50px;bottom:-70px}
.hw{max-width:1040px;margin:auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;border-radius:16px;background:#fff;object-fit:contain;padding:4px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.logo.ph{display:grid;place-items:center;font-size:30px;padding:0}
h1{margin:0;font-size:clamp(20px,5.6vw,30px);line-height:1.18;letter-spacing:-.2px}
.tag{margin:3px 0 0;font-size:13px;opacity:.92}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cta a{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:#fff;text-decoration:none;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700}
.cta a.w{background:#fff;color:var(--d);border-color:#fff}
.tools{position:sticky;top:0;z-index:20;background:#fff;max-width:1040px;margin:-26px auto 0;padding:12px 12px 8px;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.07),0 6px 12px -8px rgba(0,0,0,.18)}
.sb{position:relative}
.sb input{width:100%;border:1.5px solid var(--l);background:var(--bg);border-radius:14px;padding:12px 40px 12px 40px;outline:0;font-size:15px}
.sb input:focus{border-color:var(--g);background:#fff}
.sb i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
.sb button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--t);color:var(--d);width:28px;height:28px;border-radius:50%;font-weight:800;display:none}
.sb.has button{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--l);background:#fff;color:var(--d);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1040px;margin:auto;padding:12px 14px 2px;color:var(--mut);font-size:13px}
.meta select{border:1.5px solid var(--l);background:#fff;border-radius:10px;padding:6px 8px;color:var(--d);font-weight:600;font-size:13px}
.grid{max-width:1040px;margin:auto;padding:8px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.p{background:#fff;border:1px solid var(--l);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 8px rgba(20,30,25,.06)}
.ph{aspect-ratio:1/.62;display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pn{font-weight:700;font-size:14px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pu{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--d);background:var(--t);padding:2px 9px;border-radius:999px}
.pr{font-size:18px;font-weight:800;color:var(--d);white-space:nowrap}
.ctl{margin-top:auto;padding-top:4px}
.add{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px;font-weight:800}
.add:active{transform:scale(.97)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--t);border-radius:12px;padding:3px}
.step button{width:40px;height:36px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:20px;font-weight:800;line-height:1}
.step b{min-width:30px;text-align:center;font-size:16px}
.badge{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mut)}.empty b{display:block;font-size:34px;margin-bottom:6px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:620px;margin:auto;background:var(--d);color:#fff;border-radius:18px;padding:11px 12px 11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.3);transform:translateY(150%);transition:transform .28s;z-index:30}
#bar.on{transform:none}#bar small{display:block;opacity:.85;font-size:12px}#bar b{font-size:17px}
#bar button{background:#fff;color:var(--d);border:0;border-radius:12px;padding:11px 16px;font-weight:800;white-space:nowrap}
#cp{position:fixed;inset:0;background:rgba(10,15,12,.55);display:none;z-index:50;overflow:auto}#cp.o{display:block}
.sheet{background:#fff;max-width:560px;margin:0 auto;min-height:100%;padding:16px 16px 28px}
@media(min-width:640px){.sheet{margin:24px auto;min-height:0;border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sh h2{margin:0;font-size:20px}
.x{border:0;background:var(--t);color:var(--d);width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:800}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--l)}
.r .n{font-weight:700;overflow-wrap:anywhere}.r small{color:var(--mut)}
.r .s{display:flex;align-items:center;gap:6px;flex:0 0 auto}.r .s button{width:30px;height:30px;border:0;border-radius:9px;background:var(--t);color:var(--d);font-weight:800}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0 6px;color:var(--d)}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#33423a}
.f{width:100%;border:1.5px solid var(--l);background:var(--bg);border-radius:12px;padding:12px;outline:0}.f:focus{border-color:var(--g);background:#fff}
.note{font-size:12.5px;color:var(--mut);margin:10px 0}
#send{width:100%;background:var(--wa);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(31,170,89,.35)}
.sec{width:100%;margin-top:8px;background:var(--t);color:var(--d);border:0;border-radius:14px;padding:12px;font-weight:700}
footer{max-width:1040px;margin:14px auto 0;padding:18px 16px;color:var(--mut);font-size:12.5px;text-align:center;line-height:1.6}footer b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:#1f2a24;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header class="hero"><div class="hw"><div class="brand"><div id="lg"></div><div><h1 id="sn"></h1><p class="tag" id="si"></p></div></div><div class="cta" id="cta"></div></div></header>
<div class="tools"><div class="sb" id="sb"><i>🔍</i><input id="q" type="search" placeholder="Search products…" autocomplete="off"><button type="button" id="qx" aria-label="Clear">✕</button></div><div class="chips" id="ch"></div></div>
<div class="meta"><span id="cnt"></span><select id="so" aria-label="Sort"><option value="">Default</option><option value="az">Name A–Z</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div>
<main class="grid" id="g"></main>
<footer id="ft"></footer>
<div id="bar"><div><small id="bn"></small><b id="bt"></b></div><button type="button" id="view">View order →</button></div>
<div id="cp"><div class="sheet"><div class="sh"><h2>Your order</h2><button type="button" class="x" id="cx" aria-label="Close">✕</button></div><div id="ci"></div><div class="tot"><span>Total</span><span id="ct"></span></div>
<label for="cn">Your name *</label><input class="f" id="cn" autocomplete="name"><label for="cph">Phone number *</label><input class="f" id="cph" type="tel" autocomplete="tel"><label for="ca">Delivery address *</label><input class="f" id="ca" autocomplete="street-address"><label for="cno">Note (optional)</label><input class="f" id="cno" placeholder="e.g. Cash on delivery">
<p class="note">Delivery charges (if any) will be confirmed by the store on WhatsApp.</p><button type="button" id="send">Send order on WhatsApp</button><button type="button" class="sec" id="cc">Continue shopping</button></div></div>

const $=i=>document.getElementById(i),money=n=>'Rs '+Number(n).toLocaleString('en-PK',{maximumFractionDigits:0}),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='store_'+String(D.name||'').replace(/\W+/g,'').slice(0,24);
let cart={},cat='',q='',sort='';
const ls={get(k){try{return localStorage.getItem(KEY+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}};
try{cart=JSON.parse(ls.get('_cart')||'{}')||{}}catch(e){cart={}}
Object.keys(cart).forEach(id=>{if(!D.products.some(p=>p.id===id)||!(cart[id]>0))delete cart[id]});
const EM=[[/banspati|ghee|dalda|butter/,'🧈'],[/oil/,'🛢️'],[/milk|milki|dairy|cream|custard|jelly|kheer|khurma/,'🥛'],[/spice|masala|masla|mirch|haldi|achar|sauce|ketchup|vinegar|vinger|salt|paper|mehti/,'🌶️'],[/tea|chai/,'🍵'],[/flour|floor|atta|suji|maida|besan|baisan|macaroni|pasta|vermicelli/,'🌾'],[/gram|dal|daal|chana|lobia|moong|masoor|mash|pulse/,'🥜'],[/rice|chawal/,'🍚'],[/sugar|chini|gur|jaggery/,'🍬'],[/spray|insect/,'🧴'],[/face|lotion|soap|wash|beauty/,'🧼'],[/hair|shampoo/,'💇'],[/detergent|surf|clean|bleach/,'🧺'],[/tooth|dental|brush/,'🦷'],[/pamper|diaper|baby/,'👶'],[/juice|drink|squash|water|cola|soda|mix/,'🧃'],[/biscuit|snack|chips|candy|chocolate/,'🍪']];
function emo(p){if(p.e&&p.e!=='🛒')return p.e;const s=((p.c||'')+' '+(p.n||'')).toLowerCase();for(const [r,e] of EM)if(r.test(s))return e;return '🛒'}
function hue(s){let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h}
const qty=id=>cart[id]||0;
function saveCart(){ls.set('_cart',JSON.stringify(cart))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1200)}
/* header */
document.title=D.name+' — Online Store';
$('lg').innerHTML=D.logo?'<img class="logo" alt="" src="'+D.logo+'">':'<div class="logo ph">🛒</div>';
if(D.logo){const ic=document.createElement('link');ic.rel='icon';ic.href=D.logo;document.head.appendChild(ic)}
$('sn').textContent=D.name||'Online Store';$('si').textContent='Order online · we confirm on WhatsApp';
const digits=v=>String(v||'').replace(/\D/g,'');
let cta='';if(D.wa)cta+='<a class="w" href="https://wa.me/'+digits(D.wa)+'">💬 WhatsApp us</a>';
if(D.phone)cta+='<a href="tel:'+digits(D.phone)+'">📞 '+esc(D.phone)+'</a>';
if(D.address)cta+='<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.address)+'" target="_blank" rel="noopener">📍 Find us</a>';
$('cta').innerHTML=cta;
$('ft').innerHTML='<b>'+esc(D.name)+'</b><br>'+(D.address?esc(D.address)+'<br>':'')+(D.phone?'📞 '+esc(D.phone)+'<br>':'')+'Prices and availability may change. Delivery charges (if any) are confirmed on WhatsApp.';
/* chips */
const cats=['All'].concat(D.cats||[]);
$('ch').innerHTML=cats.map(c=>'<button type="button" data-c="'+(c==='All'?'':esc(c))+'" class="'+(c==='All'?'on':'')+'">'+(c==='All'?'🛍️ All':emo({c:c,n:''})+' '+esc(c))+'</button>').join('');
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[...$('ch').children].forEach(x=>x.classList.toggle('on',x===b));b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});render()};
$('q').oninput=function(){q=this.value.trim().toLowerCase();$('sb').classList.toggle('has',!!this.value);render()};
$('qx').onclick=()=>{$('q').value='';q='';$('sb').classList.remove('has');render();$('q').focus()};
$('so').onchange=function(){sort=this.value;render()};
/* products */
function ctl(p){const n=qty(p.id);return n?'<div class="step"><button type="button" data-a="-1" aria-label="Less">−</button><b>'+n+'</b><button type="button" data-a="1" aria-label="More">+</button></div>':'<button type="button" class="add" data-a="1">Add to order</button>'}
function card(p){const n=qty(p.id),bg='background:hsl('+hue(p.c)+' 70% 94%)';
 return '<article class="p" data-id="'+esc(p.id)+'">'+(n?'<span class="badge">'+n+' in order</span>':'')+'<div class="ph" style="'+(p.i?'':bg)+'">'+(p.i?'<img loading="lazy" alt="" src="'+p.i+'">':emo(p))+'</div><div class="pb"><div class="pn">'+esc(p.n)+'</div>'+(p.u?'<span class="pu">'+esc(p.u)+'</span>':'')+'<div class="pr">'+money(p.p)+'</div><div class="ctl">'+ctl(p)+'</div></div></article>'}
function render(){let l=D.products.filter(p=>(!cat||p.c===cat)&&(!q||((p.n||'')+' '+(p.c||'')).toLowerCase().includes(q)));
 if(sort==='az')l=l.slice().sort((a,b)=>a.n.localeCompare(b.n));if(sort==='lo')l=l.slice().sort((a,b)=>a.p-b.p);if(sort==='hi')l=l.slice().sort((a,b)=>b.p-a.p);
 $('cnt').textContent=l.length+' product'+(l.length===1?'':'s')+(cat?' in '+cat:'');
 $('g').innerHTML=l.map(card).join('')||'<div class="empty"><b>🔎</b>No products found.<br>Try another word or category.</div>';bar()}
function paint(id){const el=$('g').querySelector('[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]'),p=D.products.find(x=>x.id===id);if(!el||!p)return;el.querySelector('.ctl').innerHTML=ctl(p);const n=qty(id),b=el.querySelector('.badge');if(n){if(b)b.textContent=n+' in order';else el.insertAdjacentHTML('afterbegin','<span class="badge">'+n+' in order</span>')}else if(b)b.remove()}
function change(id,d){const p=D.products.find(x=>x.id===id);if(!p)return;const n=Math.max(0,qty(id)+d);if(n)cart[id]=n;else delete cart[id];saveCart();paint(id);bar();if(d>0&&n===1)toast('Added: '+p.n);if($('cp').classList.contains('o'))openCart(true)}
$('g').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.closest('[data-id]');if(a)change(a.dataset.id,+b.dataset.a)};
const items=()=>Object.keys(cart).map(id=>({p:D.products.find(p=>p.id===id),q:cart[id]})).filter(x=>x.p),total=()=>items().reduce((a,x)=>a+x.p.p*x.q,0);
function bar(){const n=items().reduce((a,x)=>a+x.q,0);$('bar').classList.toggle('on',n>0);$('bn').textContent=n+' item'+(n===1?'':'s')+' in your order';$('bt').textContent=money(total())}
/* cart */
function openCart(keep){const it=items();$('ci').innerHTML=it.map(x=>'<div class="r" data-id="'+esc(x.p.id)+'"><div><div class="n">'+esc(x.p.n)+'</div><small>'+money(x.p.p)+(x.p.u?' · '+esc(x.p.u):'')+'</small></div><div class="s"><button type="button" data-a="-1">−</button><b>'+x.q+'</b><button type="button" data-a="1">+</button><b style="min-width:78px;text-align:right">'+money(x.p.p*x.q)+'</b></div></div>').join('')||'<p class="note">Your order is empty.</p>';$('ct').textContent=money(total());
 if(!keep){$('cn').value=ls.get('_n')||$('cn').value;$('cph').value=ls.get('_p')||$('cph').value;$('ca').value=ls.get('_a')||$('ca').value}$('cp').classList.add('o');if(!keep)document.body.style.overflow='hidden'}
function closeCart(){$('cp').classList.remove('o');document.body.style.overflow=''}
$('ci').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=b.closest('[data-id]');if(r)change(r.dataset.id,+b.dataset.a)};
$('view').onclick=()=>openCart();$('cx').onclick=closeCart;$('cc').onclick=closeCart;$('cp').onclick=e=>{if(e.target.id==='cp')closeCart()};
$('send').onclick=()=>{const n=$('cn').value.trim(),ph=$('cph').value.trim(),a=$('ca').value.trim(),it=items();
 if(!it.length)return alert('Your order is empty.');if(!n||!ph||!a)return alert('Please enter your name, phone and address.');if(!D.wa)return alert('Store WhatsApp number is not set.');
 ls.set('_n',n);ls.set('_p',ph);ls.set('_a',a);const note=$('cno').value.trim();
 const m='*New order — '+D.name+'*\n\n'+it.map((x,i)=>(i+1)+'. '+x.p.n+(x.p.u?' ('+x.p.u+')':'')+' × '+x.q+' = '+money(x.p.p*x.q)).join('\n')+'\n\n*Total: '+money(total())+'*\n\nName: '+n+'\nPhone: '+ph+'\nAddress: '+a+(note?'\nNote: '+note:'');
 window.open('https://wa.me/'+digits(D.wa)+'?text='+encodeURIComponent(m),'_blank')||(location.href='https://wa.me/'+digits(D.wa)+'?text='+encodeURIComponent(m))};
render();
</script></body></html>
